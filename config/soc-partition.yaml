# local-soc-partition — 5-node cluster for divergent-SOC / pullsync convergence tests.
#
# Topology (before the cross-group /connect):
#
#   bootnode-0
#       │
#    group-a-0 ── group-a-1          group-b-0 ── group-b-1
#    (bootnodes → bootnode)          (bootnodes → group-b-0 only)
#              ✕ no P2P between A and B
#
# All four full nodes share target-neighborhood=11111100 so their overlays are
# mined into the same Swarm neighborhood. After you POST /connect between the
# groups they form one connected neighborhood and can pullsync.
#
# Create:
#   beekeeper create bee-cluster --cluster-name=local-soc-partition
#
# Verify isolation (A must not list B overlays in /peers and vice versa), then
# upload conflicting SOC variants to each group. Heal with e.g.:
#   curl -X POST "http://group-a-0.localhost:1633/connect/dns4/group-b-0-headless.local.svc.cluster.local/tcp/1634/p2p/16Uiu2HAmU7b6hrGccvAHRaQg6VRf84cAHbgqcQT1145CozfQU4ZR"
#
# Libp2p keys for group-b were generated with:
#   go run ./scripts/genpartitionkeys/

clusters:
  local-soc-partition:
    _inherit: "local"
    node-groups:
      bootnode:
        mode: bootnode
        bee-config: bootnode-local-dns
        config: local-dns
        nodes:
          - name: bootnode-0
            bootnodes: /dns4/bootnode-0-headless.%s.svc.cluster.local/tcp/1634/p2p/QmaHzvd3iZduu275CMkMVZKwbsjXSyH3GJRj4UvFJApKcb
            libp2p-key: '{"address":"28678fe31f09f722d53e77ca2395569f19959fa5","crypto":{"cipher":"aes-128-ctr","ciphertext":"0ff319684c4f8decf9c998047febe3417cfc45832b8bb62fd818183d54cf5d0183bfa021ed95addce3b33e83ce7ee73e926f00eea8241d96b349266a4d299829d3d22db0d536315b52b34db4a6778bfd3ce7631ad7256ea0bb9c50abea9de35d740b6fdc50caf929b1d19494690d9ed649105d02c14f5ec49d","cipherparams":{"iv":"4e9a50fb5852b5e61964f696be78066b"},"kdf":"scrypt","kdfparams":{"n":32768,"r":8,"p":1,"dklen":32,"salt":"4d513e81647e4150bb648ed8d2dda28d460802336bf24d620119eac66ae0c0c4"},"mac":"9ae71db96e5ddc1c214538d42082212bbbe53aeac09fcc3e3a8eff815648331e"},"version":3,"id":"ae3bc991-d89f-405a-9e6a-60e27347e22d"}'
            swarm-key: '{"address":"f176839c150e52fe30e5c2b5c648465c6fdfa532","crypto":{"cipher":"aes-128-ctr","ciphertext":"352af096f0fca9dfbd20a6861bde43d988efe7f179e0a9ffd812a285fdcd63b9","cipherparams":{"iv":"613003f1f1bf93430c92629da33f8828"},"kdf":"scrypt","kdfparams":{"n":32768,"r":8,"p":1,"dklen":32,"salt":"ad1d99a4c64c95c26131e079e8c8a82221d58bf66a7ceb767c33a4c376c564b8"},"mac":"cafda1bc8ca0ffc2b22eb69afd1cf5072fd09412243443be1b0c6832f57924b6"},"version":3}'
      group-a:
        mode: node
        bee-config: bee-soc-partition-group-a
        config: local-dns
        count: 2
      group-b:
        mode: node
        bee-config: bee-soc-partition-group-b
        config: local-dns
        nodes:
          # Soft bootnode for the B island. Peer ID must match libp2p-key.
          - name: group-b-0
            libp2p-key: '{"address":"dbc4584b50b571e4c426048ca30f3bbf31256664","crypto":{"cipher":"aes-128-ctr","ciphertext":"9e0fb2432abc8d5a591e62e9e79bb028564e6de172b3ad3acacceec01c52bf1c","cipherparams":{"iv":"e6421bbcbaee2afe1cde22cb9c87fe6a"},"kdf":"scrypt","kdfparams":{"n":32768,"r":8,"p":1,"dklen":32,"salt":"e707f2cc3b18e98b4901df78afff7d22c42ee8bd5ffb4aa2692c327a406fda48"},"mac":"14516bd67bc56c8722b5784e9de3844a10eefedfcd2746deacd8eba46e834aa9"},"version":3,"id":"a3f5c9e7-e116-4c9b-b605-f007b0d94589"}'
          - name: group-b-1
            libp2p-key: '{"address":"f64dc5d1a2233919f903a5582dd1d5b0b24cd255","crypto":{"cipher":"aes-128-ctr","ciphertext":"69eaf4a5a65992b0ac69f0a73c768cff8507e0d3538629cfbf46ce3cc57d6270","cipherparams":{"iv":"13a5007d75c76d353d7ee05913fc6905"},"kdf":"scrypt","kdfparams":{"n":32768,"r":8,"p":1,"dklen":32,"salt":"69b56b0b71cef94a143b8cea095d8c2ee08a27d53cc99e007e8a5a36fd4f1c08"},"mac":"3514368a10020d238af1c5af42b134d1b179e59e4acbb8f4ded938178cdec8eb"},"version":3,"id":"e66e3d13-db28-455b-a02d-98f3d7a6508f"}'

bee-configs:
  # Joins the main bootnode (empty bootnodes → filled from bootnode group).
  bee-soc-partition-group-a:
    _inherit: "bee-local-dns"
    full-node: true
    target-neighborhood: "11111100"
    welcome-message: "soc-partition group-a"

  # Isolated from the main bootnode: dials group-b-0 instead (soft bootnode).
  # Non-empty bootnodes is required so beekeeper does not inject bootnode-0.
  bee-soc-partition-group-b:
    _inherit: "bee-local-dns"
    full-node: true
    bootnode:
      - /dns4/group-b-0-headless.local.svc.cluster.local/tcp/1634/p2p/16Uiu2HAmU7b6hrGccvAHRaQg6VRf84cAHbgqcQT1145CozfQU4ZR
    target-neighborhood: "11111100"
    welcome-message: "soc-partition group-b"
